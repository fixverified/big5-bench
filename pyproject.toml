[project]
name = "big5-bench"
version = "0.1.0"
description = "Measures how language models rate themselves on public-domain Big Five personality items."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["litellm==1.99.0", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/big5_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
